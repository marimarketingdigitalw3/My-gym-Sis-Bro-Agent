# Configuración mínima para la CLI de Supabase (supabase start / supabase functions serve).
project_id = "my-gym-sis"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:4173/reset-password"]

[auth.email]
enable_confirmations = true

[functions.coach-chat]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
